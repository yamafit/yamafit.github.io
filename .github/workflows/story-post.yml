name: ストーリーズだけ投稿（手動）
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-24.04   # ubuntu-latest が 26.04 になり Playwright が動かなくなったため固定（2026-11-05）
    timeout-minutes: 20
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo rm -f /var/lib/man-db/auto-update; timeout 300 sudo apt-get update -qq && timeout 900 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra python3-pil
      - run: node tools/daily-image-post.mjs story
      - run: |
          git config user.name "yamafit-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ig-posts.json
          git diff --cached --quiet || (git commit -m "ストーリーズを投稿" && git pull --rebase --autostash && git push)
