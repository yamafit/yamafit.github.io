name: 調査（公式ページの一覧を取得）
on:
  push:
    branches: [main]
    paths: ["tools/probe-job.sh"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04   # ubuntu-latest が 26.04 になり Playwright が動かなくなったため固定（2026-11-05）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p out/probe && sh tools/probe-job.sh || true
      - name: probe-out ブランチに置く
        run: |
          cd out/probe && git init -q -b probe-out
          git config user.name "yamafit-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "probe" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
