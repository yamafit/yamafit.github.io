name: 最新記事を更新
on:
  schedule:
    - cron: "0 * * * *"   # 1時間ごと（GitHubの都合で数分〜十数分遅れることがあります）
  workflow_dispatch: {}    # 手動実行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fetch-news.mjs
      - name: 変更があれば保存
        run: |
          git config user.name "yamafit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "最新記事を更新" && git pull --rebase && git push)
