name: AIのおすすめを更新
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 朝6時（日本時間）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/recommend.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 未設定なら点数方式で選ぶ
      - name: 変更があれば保存
        run: |
          git config user.name "yamafit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/recommendations.json
          git diff --cached --quiet || (git commit -m "AIのおすすめを更新" && git pull --rebase && git push)
