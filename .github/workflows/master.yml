name: 商品の価格・在庫を更新
on:
  schedule:
    - cron: "30 18 * * *"   # 毎日 3:30（日本時間）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/refresh-offers.mjs
      - run: node tools/validate-master.mjs
      - run: node tools/build-products.mjs
      - name: 変更があれば保存
        run: |
          git config user.name "yamafit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/master data/products.json
          git diff --cached --quiet || (git commit -m "商品の価格・在庫を更新" && git pull --rebase && git push)
