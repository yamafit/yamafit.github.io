name: Instagramの反応を集める（週次レポート用・投稿はしない）
on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 22 * * 0"   # 日本時間 月曜 7:10
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 反応を集める
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node tools/ig-insights.mjs
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ig-insights.json
          git diff --cached --quiet && exit 0
          git commit -m "Instagramの反応を記録"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
