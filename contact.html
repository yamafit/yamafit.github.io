<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜ヤマフィット</title>
<link rel="stylesheet" href="css/style.css?v=202610052326">
</head>
<body>
<div class="page">

<header class="header header--line" id="top">
  <a class="logo" href="index.html"><b>ヤマフィット</b><span>YAMAFIT</span></a>
  <a class="icon-btn" href="index.html" aria-label="ホームにもどる">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
</header>

<main class="doc">
<div class="stack" style="gap: 8px">
  <div class="crumb"><a href="index.html">ホーム</a> ／ お問い合わせ</div>
  <h1>お問い合わせ</h1>
  <p class="doc-lead">ヤマフィットへのご意見、ご質問、掲載内容に関するご連絡は、下記のフォームからお送りください。通常、3営業日以内に返信します。</p>
</div>

<!-- 送信先は js/site.js の formUrl に入れる（空の間はテスト表示のみ） -->
<form class="form" id="contact-form" action="#" method="post">
  <div class="field">
    <label for="name">お名前<span class="req">必須</span></label>
    <input class="input" id="name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="field">
    <label for="email">メールアドレス<span class="req">必須</span></label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
  </div>
  <div class="field">
    <label for="message">お問い合わせ内容<span class="req">必須</span></label>
    <textarea class="textarea" id="message" name="message" required></textarea>
  </div>
  <p class="hint">ご入力いただいた情報は、お問い合わせへの対応にのみ使用します。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。</p>
  <button class="btn btn--lg" type="submit">送信する</button>
  <div class="thanks" id="thanks" role="status" hidden>送信ありがとうございました。内容を確認のうえ、3営業日以内にご返信します。</div>
</form>
<script>
  // 見た目の確認用。本番では form の action を実際の送信先に変える。
  document.getElementById("contact-form").addEventListener("submit", function (e) {
    if (this.getAttribute("action") === "#") {
      e.preventDefault();
      document.getElementById("thanks").hidden = false;
    }
  });
</script>
</main>

</div>

<footer class="footer">
  <div class="footer-inner">
    <nav aria-label="フッター"><a href="about.html">運営者情報</a><a href="privacy.html">プライバシーポリシー</a><a href="contact.html">お問い合わせ</a></nav>
    <div class="mono">YAMAFIT</div>
  </div>
</footer>
<script src="js/app.js?v=202610052326"></script>
<script src="js/site.js?v=202610052326"></script>
</body>
</html>
