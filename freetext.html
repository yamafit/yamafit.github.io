<!doctype html>
<html lang="ja">
<head>
<script>location.replace("index.html");</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装備診断 6/6｜ヤマフィット</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css?v=202610121200">
</head>
<body>
<div class="page q-page">

<header class="q-head">
  <a class="icon-btn" href="question.html" aria-label="前の質問にもどる">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <div class="q-count">2 / 2</div>
  <a class="icon-btn" href="index.html" aria-label="診断をやめる">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
</header>

<div class="progress" aria-hidden="true" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><i class="on"></i><i class="on"></i></div>

<main class="q-main" style="gap: 22px">
  <div class="q-intro">
    <div class="eyebrow" style="letter-spacing: .1em">最後の質問</div>
    <h1 class="q-title">気になっていることは<br>ありますか？</h1>
    <p class="q-lead">体のこと、苦手なこと、予算など。書いた内容は、結果の画面に表示するために使います（サーバーには送信しません）。</p>
  </div>

  <div class="field">
    <label for="concern">自由に書く（任意）</label>
    <textarea class="textarea" id="concern" rows="4" placeholder="例：下りで膝が痛くなりやすい"></textarea>
  </div>

  <div class="field" style="gap: 10px">
    <div class="field-title">よくある悩みから選ぶ</div>
    <div class="chips">
      <button class="chip" type="button" data-value="knee" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>膝が不安</span></button>
      <button class="chip" type="button" data-value="sweat" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>汗をかきやすい</span></button>
      <button class="chip" type="button" data-value="cold" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>寒がり</span></button>
      <button class="chip" type="button" data-value="budget" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>予算をおさえたい</span></button>
      <button class="chip" type="button" data-value="light" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>荷物を軽くしたい</span></button>
    </div>
  </div>
</main>

<div class="q-foot" style="padding-bottom: 24px">
  <a class="btn btn--lg" id="to-result" href="result.html">
    <span>診断結果を見る</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>

</div>
<script src="js/site.js?v=202610121200"></script>
<script src="js/app.js?v=202610121200"></script>
<script src="js/diagnosis.js?v=202610121200"></script>
</body>
</html>
