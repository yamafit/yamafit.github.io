  <a class="logo" href="index.html"><b>ヤマフィット</b><span>YAMAFIT</span></a>
  <button class="icon-btn" type="button" aria-label="メニューを開く"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<main class="doc" style="gap: 20px">
  <div class="stack" style="gap: 8px">
    <div class="crumb"><a href="index.html">ホーム</a> ／ 商品一覧</div>
    <h1>商品一覧</h1>
    <p class="doc-lead">商品名・ブランドで検索し、カテゴリーやブランドで絞り込めます。価格・重量・素材は、各ブランド公式ページの記載（確認日つき）にもとづきます。</p>
  </div>
  <form class="pf" id="pf" role="search" onsubmit="return false">
    <div class="search">
      <label for="pf-q" style="position:absolute; left:-9999px">商品名で検索</label>
      <input class="input" id="pf-q" type="search" placeholder="商品名・ブランドで検索" autocomplete="off">
    </div>
    <div class="pf-row"><b>カテゴリー</b><div class="cats" id="pf-cats"></div></div>
    <div class="pf-row"><b>ブランド（複数選べます）</b><div class="pf-brands" id="pf-brands"></div></div>
    <div class="pf-row" id="pf-extra"></div>
    <div class="pf-row"><label for="pf-sort"><b>並び順</b></label><select id="pf-sort"><option value="">おすすめ順（カテゴリー・ブランド順）</option><option value="price-asc">価格が安い順</option><option value="price-desc">価格が高い順</option><option value="weight-asc">軽い順</option></select></div>
    <div class="pf-count" id="pf-count" role="status"></div>
  </form>
  <div id="pf-list"></div>
  <p class="rank-basis">並び順は、選んだ条件（価格・重量など）だけで決まります。アフィリエイト報酬の高さは、並び順や評価に使っていません。</p>
